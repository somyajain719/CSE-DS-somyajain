<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile Cards</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        /* Main container */
        .container {
            display: flex;
            justify-content: center;   /* center cards horizontally */
            align-items: center;       /* center cards vertically */
            gap: 30px;                 /* space between cards */
            margin-top: 100px;
        }

        /* Card design */
        .card {
            background-color: white;
            width: 220px;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0px 2px 8px rgba(0,0,0,0.2);
        }

        /* Circle initials */
        .circle {
            width: 80px;
            height: 80px;
            background-color: #1e90ff;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            margin: auto;
            margin-bottom: 15px;
        }

        h3 {
            margin: 10px 0;
        }

        p {
            margin: 4px 0;
            color: gray;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="card">
            <div class="circle">JK</div>
            <h3>Jeet Kumar</h3>
            <p>B.Tech - CSE</p>
            <p>Roll No: 21CS1007</p>
            <p>1st Year</p>
        </div>

        <div class="card">
            <div class="circle">AR</div>
            <h3>Asha Rani</h3>
            <p>B.Tech - IT</p>
            <p>Roll No: 21IT1012</p>
            <p>1st Year</p>
        </div>

        <div class="card">
            <div class="circle">RK</div>
            <h3>Rohit Kumar</h3>
            <p>B.Tech - ECE</p>
            <p>Roll No: 21EC1009</p>
            <p>1st Year</p>
        </div>

    </div>

</body>
</html>
